<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5722"/>
      <stop offset="100%" stop-color="#ff9100"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffab40" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff3d00" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="#0c1017"/>
  <circle cx="256" cy="256" r="230" fill="url(#glowGrad)"/>
  
  <!-- Outer Timer Ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#222b38" stroke-width="24"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#bgGrad)" stroke-width="24" stroke-dasharray="1162" stroke-dashoffset="290" stroke-linecap="round"/>

  <!-- Floorball Ball with Classic Perforations -->
  <circle cx="256" cy="256" r="120" fill="#ffffff"/>
  <!-- Ball holes -->
  <circle cx="256" cy="256" r="22" fill="#0c1017"/>
  <circle cx="256" cy="180" r="17" fill="#0c1017"/>
  <circle cx="256" cy="332" r="17" fill="#0c1017"/>
  <circle cx="180" cy="256" r="17" fill="#0c1017"/>
  <circle cx="332" cy="256" r="17" fill="#0c1017"/>
  <circle cx="202" cy="202" r="17" fill="#0c1017"/>
  <circle cx="310" cy="202" r="17" fill="#0c1017"/>
  <circle cx="202" cy="310" r="17" fill="#0c1017"/>
  <circle cx="310" cy="310" r="17" fill="#0c1017"/>

  <!-- Stopwatch Top Button -->
  <rect x="236" y="24" width="40" height="36" rx="10" fill="#ff5722"/>
</svg>